<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis notas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <h1>Mis notas</h1>
    <p class="subtitulo">Organiza tus ideas en un solo lugar.</p>

    <section class="tarjeta" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Crear nota</h2>

      <form id="formulario">
        <label for="titulo">Título</label>
        <input id="titulo" type="text" maxlength="80" required>

        <label for="contenido">Contenido</label>
        <textarea id="contenido" rows="4" required></textarea>

        <button type="submit" class="principal">Agregar nota</button>
      </form>

      <p id="mensaje" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="titulo-notas">
      <h2 id="titulo-notas">Mis notas guardadas</h2>
      <div id="lista-notas"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
